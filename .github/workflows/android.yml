name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # necessário para publicar a Release (atualização automática do app)

jobs:
  build:
    name: Testar e gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK (já instalado no runner; aceita licenças)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Permissão de execução do Gradle Wrapper
        run: chmod +x gradlew

      - name: Preparar assinatura personalizada (opcional, via secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Usando keystore dos secrets do repositório."
          else
            echo "Usando keystore padrão do projeto (app/signing)."
          fi

      - name: Testes unitários
        run: ./gradlew --no-daemon testDebugUnitTest
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Compilar APK de release
        run: ./gradlew --no-daemon assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Esquemas do banco de dados (Room)
        if: always()
        run: |
          for f in $(find app/schemas -name "*.json" 2>/dev/null | sort); do
            echo "===== SCHEMA $f ====="
            cat "$f"
            echo
            echo "===== END SCHEMA ====="
          done

      - name: Renomear APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK não encontrado"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/art-das-baterias.apk
          ls -lh dist/

      - name: Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: art-das-baterias
          path: dist/art-das-baterias.apk
          if-no-files-found: error
          retention-days: 30

      # Cada build publicado vira uma "Release" no GitHub. O app verifica a Release mais recente
      # e oferece a atualização automaticamente (Menu > Backup e sincronização > Atualizações).
      - name: Publicar versão para atualização automática (GitHub Release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Versão 1.0.${{ github.run_number }}
          body: |
            Art das Baterias — versão 1.0.${{ github.run_number }}

            ${{ github.event.head_commit.message }}
          files: dist/art-das-baterias.apk
          make_latest: true

      - name: Publicar relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
