name: Segurança

# Roda a cada envio de código, toda segunda-feira e manualmente (Actions > "Segurança" > Run workflow).
on:
  push:
    branches: [main, master, "claude/**"]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Senhas e chaves vazadas (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar segredos no código e no histórico
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  codigo:
    name: Análise do código (CodeQL)
    # CodeQL é gratuito só em repositório público; com o repositório privado este passo é pulado.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - name: Compilar (necessário para analisar Kotlin)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
